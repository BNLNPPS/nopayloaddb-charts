{{- if .Values.pgbouncer.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "npdbchart.fullname" . }}-pgbouncer-conf
  labels:
    {{- include "npdbchart.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
data:
  pgbouncer.ini: |
    [databases]
    pgbouncer =
    {{ .Values.database.writer.name }} = host={{ .Values.database.writer.host }} port={{ .Values.database.writer.port }} dbname={{ .Values.database.writer.name }}
    {{ .Values.database.reader1.name }} = host={{ .Values.database.reader1.host }} port={{ .Values.database.reader1.port }} dbname={{ .Values.database.reader1.name }}
    {{ .Values.database.reader2.name }} = host={{ .Values.database.reader2.host }} port={{ .Values.database.reader2.port }} dbname={{ .Values.database.reader2.name }}
    [pgbouncer]
    admin_users = {{ .Values.database.writer.user }}
    ignore_startup_parameters = extra_float_digits
    listen_addr = *
    listen_port = 6432
    logfile = /var/log/pgbouncer/pgbouncer.log
    pidfile = /var/run/pgbouncer/pgbouncer.pid
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt
    unix_socket_dir = /var/run/pgbouncer
    pool_mode = transaction
    max_client_conn = 10000
    default_pool_size = 1100
    reserve_pool_size = 400
    reserve_pool_timeout = 5
  userlist.txt: |
    {{ .Values.database.writer.user | quote }} {{ .Values.database.writer.password | quote }}
    {{- if ne .Values.database.reader1.user .Values.database.writer.user }}
    {{ .Values.database.reader1.user | quote }} {{ .Values.database.reader1.password | quote }}
    {{- end }}
    {{- if and (ne .Values.database.reader2.user .Values.database.writer.user) (ne .Values.database.reader2.user .Values.database.reader1.user) }}
    {{ .Values.database.reader2.user | quote }} {{ .Values.database.reader2.password | quote }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "npdbchart.fullname" . }}-pgbouncer
  labels:
    {{- include "npdbchart.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
spec:
  replicas: {{ .Values.pgbouncer.replicas }}
  selector:
    matchLabels:
      {{- include "npdbchart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pgbouncer
  template:
    metadata:
      labels:
        {{- include "npdbchart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pgbouncer
    spec:
      {{- if .Values.pgbouncer.node }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - {{ .Values.pgbouncer.node }}
      {{- end }}
      containers:
      - name: pgbouncer
        image: {{ include "npdbchart.workloadImage" (dict "root" . "component" "pgbouncer" "image" .Values.images.pgbouncer) | quote }}
        imagePullPolicy: {{ .Values.images.pgbouncer.pullPolicy }}
        ports:
        - containerPort: 6432
        volumeMounts:
        - name: pgbouncer-conf
          mountPath: /etc/pgbouncer
          readOnly: true
      volumes:
      - name: pgbouncer-conf
        configMap:
          name: {{ include "npdbchart.fullname" . }}-pgbouncer-conf
          items:
           - key: pgbouncer.ini
             path: pgbouncer.ini
           - key: userlist.txt
             path: userlist.txt
---
kind: Service
apiVersion: v1
metadata:
  name: {{ include "npdbchart.fullname" . }}-pgbouncer
  labels:
    {{- include "npdbchart.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
spec:
  selector:
    {{- include "npdbchart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
  ports:
    - name: "6432-tcp"
      protocol: TCP
      port: 6432
      targetPort: 6432
  type: ClusterIP
  sessionAffinity: None
{{- end }}
