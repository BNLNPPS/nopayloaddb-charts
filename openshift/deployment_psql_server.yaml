# Deploy with:
#   INSTANCE_NAME=b2testpsql-primary NAMESPACE=belle2-cdb POSTGRESQL_DATABASE=conditions \
#     envsubst '${INSTANCE_NAME} ${NAMESPACE} ${POSTGRESQL_DATABASE}' \
#     < openshift/deployment_psql_server.yaml | kubectl apply -f -
#
# The quoted variable list is REQUIRED, not optional. A bare `envsubst` substitutes
# EVERY $VAR it sees, including the shell variables inside the postStart hook below
# ($PGDATA_DIR, $HBA_FILE, $PID) — it replaces them with empty strings and silently
# turns the hook into a no-op, so the replication pg_hba rules never get added.
# Listing the variables explicitly leaves every other $VAR untouched.
#
# Verify before applying:
#   ... | grep HBA_FILE     # must still read "$PGDATA_DIR/pg_hba.conf"
---
apiVersion: v1
kind: Service
metadata:
  name: b2testpsql-primary-headless
  namespace: ${NAMESPACE}
spec:
  clusterIP: None
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
    - port: 9187
      targetPort: 9187
      name: metrics
  # Must match the pod template labels below, which are fixed. Do NOT template this
  # on INSTANCE_NAME: a different INSTANCE_NAME would leave the Service with no
  # endpoints and the replica unable to reach the primary.
  selector:
    app: b2testpsql-primary
---
apiVersion: v1
kind: Service
metadata:
  name: b2testpsql-primary
  namespace: ${NAMESPACE}
  labels:
    metrics-target: postgres
    postgres-role: primary
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
    - port: 9187
      targetPort: 9187
      name: metrics
  selector:
    app: b2testpsql-primary
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ${INSTANCE_NAME}
  namespace: ${NAMESPACE}
spec:
  serviceName: b2testpsql-primary-headless
  replicas: 1
  selector:
    matchLabels:
      app: b2testpsql-primary
  template:
    metadata:
      labels:
        app: b2testpsql-primary
    spec:
      securityContext:
        # OpenShift assigns the UID from the namespace range regardless; false never
        # granted root, and it trips Pod Security Admission's "restricted" profile.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: postgres-logs
          emptyDir: {}
        - name: promtail-config
          configMap:
            name: promtail-config
      containers:
        - name: ${INSTANCE_NAME}
          image: postgres:15.9
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - |
                    set +e
                    PGDATA_DIR="${PGDATA:-/var/lib/postgresql/data/pgdata}"
                    HBA_FILE="$PGDATA_DIR/pg_hba.conf"
                    for i in $(seq 1 60); do
                      [ -f "$HBA_FILE" ] && break
                      sleep 1
                    done
                    if [ -f "$HBA_FILE" ]; then
                      grep -Eq '^host[[:space:]]+replication[[:space:]]+all[[:space:]]+0\.0\.0\.0/0[[:space:]]+scram-sha-256$' "$HBA_FILE" || \
                        echo 'host replication all 0.0.0.0/0 scram-sha-256' >> "$HBA_FILE"
                      grep -Eq '^host[[:space:]]+replication[[:space:]]+all[[:space:]]+::/0[[:space:]]+scram-sha-256$' "$HBA_FILE" || \
                        echo 'host replication all ::/0 scram-sha-256' >> "$HBA_FILE"
                      if [ -s "$PGDATA_DIR/postmaster.pid" ]; then
                        PID=$(head -n1 "$PGDATA_DIR/postmaster.pid")
                        kill -HUP "$PID" 2>/dev/null
                      fi
                    fi

                    exit 0
          args:
            - "-c"
            - "shared_preload_libraries=pg_stat_statements"
            - "-c"
            - "pg_stat_statements.track=all"
            - "-c"
            - "log_min_duration_statement=500"
            - "-c"
            - "logging_collector=on"
            - "-c"
            - "log_directory=/var/log/postgresql"
            - "-c"
            - "log_filename=postgresql-%Y-%m-%d.log"
          ports:
            - containerPort: 5432
              name: postgres
          env:
            # PGDATA must be a SUBDIRECTORY of the mounted volume. OpenShift runs the
            # container with an arbitrary UID and the PVC mount point stays owned by
            # root, so initdb cannot chmod it to 0700 and aborts. A subdirectory is
            # created by the runtime UID itself, so the chmod succeeds.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: "${POSTGRESQL_DATABASE}"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: b2testpsql-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: b2testpsql-credentials
                  key: password
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-logs
              mountPath: /var/log/postgresql
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          ports:
            - containerPort: 9187
              name: metrics
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: b2testpsql-exporter-dsn
                  key: dsn
        - name: promtail
          image: grafana/promtail:2.9.0
          args:
            - "-config.file=/etc/promtail/promtail-config.yaml"
          volumeMounts:
            - name: postgres-logs
              mountPath: /var/log/postgresql
            - name: promtail-config
              mountPath: /etc/promtail
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
