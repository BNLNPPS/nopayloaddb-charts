name: Publish NPDB Helm chart

on:
  push:
    branches:
      - main
    paths:
      - npdb/**
      - .github/workflows/publish-npdb.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-npdb
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Download chart dependencies
        run: helm dependency build ./npdb --skip-refresh

      - name: Lint chart
        run: helm lint ./npdb

      - name: Package chart
        run: helm package ./npdb --destination ./dist

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish chart
        env:
          OWNER: ${{ github.repository_owner }}
        run: helm push ./dist/*.tgz "oci://ghcr.io/${OWNER,,}/charts"
