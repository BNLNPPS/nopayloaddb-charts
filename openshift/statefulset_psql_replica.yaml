# Deploy with:
#   NAMESPACE=belle2-cdb \
#     envsubst '${NAMESPACE}' \
#     < openshift/statefulset_psql_replica.yaml | kubectl apply -f -
#
# The quoted variable list is REQUIRED. ${NAMESPACE} is the only deploy-time
# placeholder here; ${POSTGRES_USER}, ${POSTGRES_PASSWORD} and $PGDATA in the seed
# init container are RUNTIME shell variables read from the container env. A bare
# `envsubst` blanks all three, producing `pg_basebackup -U "" -D ""`, which fails
# and leaves the replica stuck in Init.
#
# Verify before applying:
#   ... | grep 'pg_basebackup' -A3   # -U and -D must still show $VAR references
---
apiVersion: v1
kind: Service
metadata:
  name: b2testpsql-replica-headless
  namespace: ${NAMESPACE}
spec:
  clusterIP: None
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
    - port: 9187
      targetPort: 9187
      name: metrics
  selector:
    app: b2testpsql-replica
---
apiVersion: v1
kind: Service
metadata:
  name: b2testpsql-replica
  namespace: ${NAMESPACE}
  labels:
    metrics-target: postgres
    postgres-role: replica
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
    - port: 9187
      targetPort: 9187
      name: metrics
  selector:
    app: b2testpsql-replica
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: b2testpsql-replica
  namespace: ${NAMESPACE}
spec:
  serviceName: b2testpsql-replica-headless
  replicas: 1
  selector:
    matchLabels:
      app: b2testpsql-replica
  template:
    metadata:
      labels:
        app: b2testpsql-replica
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: postgres-logs
          emptyDir: {}
        - name: promtail-config
          configMap:
            name: promtail-config
      initContainers:
        - name: seed-from-primary
          image: postgres:15.9
          command:
            - /bin/bash
            - -ec
            - |
              if [ -s "$PGDATA/PG_VERSION" ]; then
                exit 0
              fi
              # Only ever touch the subdirectory: the volume root is owned by root
              # under OpenShift's arbitrary UID and may contain lost+found.
              rm -rf "$PGDATA"
              # -R is required: it writes primary_conninfo into postgresql.auto.conf
              # and creates standby.signal. Without it the standby starts, accepts
              # read-only connections and looks healthy, but never connects to the
              # primary and silently stays frozen at the seed LSN.
              PGPASSWORD="${POSTGRES_PASSWORD}" pg_basebackup \
                -h b2testpsql-primary.${NAMESPACE}.svc.cluster.local \
                -U "${POSTGRES_USER}" \
                -D "$PGDATA" \
                -R \
                --wal-method=stream \
                --checkpoint=fast

              chmod 700 "$PGDATA"
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: b2testpsql-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: b2testpsql-credentials
                  key: password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:15.9
          args:
            - "-c"
            - "log_min_duration_statement=500"
            - "-c"
            - "logging_collector=on"
            - "-c"
            - "log_directory=/var/log/postgresql"
            - "-c"
            - "log_filename=postgresql-%Y-%m-%d.log"
          ports:
            - containerPort: 5432
              name: postgres
          env:
            # Must match the seed init container and the primary. See the note in
            # deployment_psql_server.yaml for why this cannot be the mount root.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: conditions
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: b2testpsql-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: b2testpsql-credentials
                  key: password
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-logs
              mountPath: /var/log/postgresql
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          ports:
            - containerPort: 9187
              name: metrics
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: b2testpsql-exporter-dsn
                  key: dsn
        - name: promtail
          image: grafana/promtail:2.9.0
          args:
            - "-config.file=/etc/promtail/promtail-config.yaml"
          volumeMounts:
            - name: postgres-logs
              mountPath: /var/log/postgresql
            - name: promtail-config
              mountPath: /etc/promtail
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi