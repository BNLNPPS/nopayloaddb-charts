{{- if eq .Values.backend.type "django" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "npdbchart.fullname" . }}-django
  labels:
    {{- include "npdbchart.labels" . | nindent 4 }}
    app.kubernetes.io/component: django
spec:
  replicas: {{ .Values.django.replicas }}
  selector:
    matchLabels:
      {{- include "npdbchart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: django
  template:
    metadata:
      labels:
        {{- include "npdbchart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: django
    spec:
      {{- if .Values.scheduling.excludeNode }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - {{ .Values.scheduling.excludeNode }}
      {{- end }}
      containers:
      - name: django
        image: {{ include "npdbchart.workloadImage" (dict "root" . "component" "django" "image" .Values.images.django) | quote }}
        imagePullPolicy: {{ .Values.images.django.pullPolicy }}
        ports:
        - containerPort: 8080
          protocol: TCP
        {{- if .Values.django.migrations.enabled }}
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - python3 manage.py makemigrations cdb_rest; python3 manage.py migrate cdb_rest
        {{- end }}
        env:
        - name: POSTGRES_HOST_W
          value: {{ if .Values.pgbouncer.enabled }}{{ include "npdbchart.fullname" . }}-pgbouncer{{ else }}{{ include "npdbchart.databaseValue" (dict "root" . "connection" "writer" "field" "host") }}{{ end }}
        - name: POSTGRES_DB_W
          value: {{ include "npdbchart.databaseValue" (dict "root" . "connection" "writer" "field" "name") }}
        - name: POSTGRES_USER_W
          value: {{ include "npdbchart.databaseValue" (dict "root" . "connection" "writer" "field" "user") }}
        - name: POSTGRES_PASSWORD_W
          value: {{ include "npdbchart.databaseValue" (dict "root" . "connection" "writer" "field" "password") }}
        - name: POSTGRES_PORT_W
          value: {{ if .Values.pgbouncer.enabled }}"6432"{{ else }}{{ include "npdbchart.databaseValue" (dict "root" . "connection" "writer" "field" "port") | quote }}{{ end }}
        - name: POSTGRES_HOST_R1
          value: {{ if .Values.pgbouncer.enabled }}{{ include "npdbchart.fullname" . }}-pgbouncer{{ else }}{{ include "npdbchart.databaseValue" (dict "root" . "connection" "reader1" "field" "host") }}{{ end }}
        - name: POSTGRES_DB_R1
          value: {{ include "npdbchart.databaseValue" (dict "root" . "connection" "reader1" "field" "name") }}
        - name: POSTGRES_USER_R1
          value: {{ include "npdbchart.databaseValue" (dict "root" . "connection" "reader1" "field" "user") }}
        - name: POSTGRES_PASSWORD_R1
          value: {{ include "npdbchart.databaseValue" (dict "root" . "connection" "reader1" "field" "password") }}
        - name: POSTGRES_PORT_R1
          value: {{ if .Values.pgbouncer.enabled }}"6432"{{ else }}{{ include "npdbchart.databaseValue" (dict "root" . "connection" "reader1" "field" "port") | quote }}{{ end }}
        - name: POSTGRES_HOST_R2
          value: {{ if .Values.pgbouncer.enabled }}{{ include "npdbchart.fullname" . }}-pgbouncer{{ else }}{{ include "npdbchart.databaseValue" (dict "root" . "connection" "reader2" "field" "host") }}{{ end }}
        - name: POSTGRES_DB_R2
          value: {{ include "npdbchart.databaseValue" (dict "root" . "connection" "reader2" "field" "name") }}
        - name: POSTGRES_USER_R2
          value: {{ include "npdbchart.databaseValue" (dict "root" . "connection" "reader2" "field" "user") }}
        - name: POSTGRES_PASSWORD_R2
          value: {{ include "npdbchart.databaseValue" (dict "root" . "connection" "reader2" "field" "password") }}
        - name: POSTGRES_PORT_R2
          value: {{ if .Values.pgbouncer.enabled }}"6432"{{ else }}{{ include "npdbchart.databaseValue" (dict "root" . "connection" "reader2" "field" "port") | quote }}{{ end }}
        - name: CDB_IOV_MODE
          value: {{ .Values.cdb.iovMode | quote }}
        - name: PERMISSION_PLUGIN_CLASS
          value: {{ .Values.cdb.permissionPluginClass | quote }}
        - name: CDB_AUTH_CLASS
          value: {{ .Values.cdb.authClass | quote }}
        {{- if .Values.cdb.jwtSecret }}
        - name: JWT_SECRET
          value: {{ .Values.cdb.jwtSecret | quote }}
        {{- end }}
        {{- if .Values.cdb.payloadBaseUrl }}
        - name: CDB_PAYLOAD_BASE_URL
          value: {{ .Values.cdb.payloadBaseUrl | quote }}
        {{- end }}
        volumeMounts:
        - name: run
          mountPath: /var/run
        - name: varlog
          mountPath: /var/log
      {{- if .Values.promtail.enabled }}
      - name: promtail
        image: {{ include "npdbchart.externalImage" .Values.images.promtail | quote }}
        imagePullPolicy: {{ .Values.images.promtail.pullPolicy }}
        args:
          - "-config.file=/etc/promtail/promtail-config.yaml"
        volumeMounts:
          - name: varlog
            mountPath: /var/log
          - name: promtail-config
            mountPath: /etc/promtail
      {{- end }}
      volumes:
        - name: run
          emptyDir: {}
        - name: varlog
          emptyDir: {}
        {{- if .Values.promtail.enabled }}
        - name: promtail-config
          configMap:
            name: {{ .Values.promtail.configMapName }}
        {{- end }}
---
kind: Service
apiVersion: v1
metadata:
  name: {{ include "npdbchart.fullname" . }}-django
  labels:
    {{- include "npdbchart.labels" . | nindent 4 }}
    app.kubernetes.io/component: django
spec:
  selector:
    {{- include "npdbchart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: django
  ports:
    - name: "tcp-8000"
      protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
{{- end }}
