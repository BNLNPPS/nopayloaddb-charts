apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "npdb.fullname" . }}-nginx-conf
  labels:
    {{- include "npdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main_with_cache '$remote_addr - $remote_user [$time_local] '
                                    '"$request" $status $body_bytes_sent '
                                    '"$http_referer" "$http_user_agent" '
                                    '$upstream_cache_status';

        access_log /dev/stdout main_with_cache;
        error_log /dev/stderr warn;

        # Shared Cache Configuration
        proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:50m max_size=500m inactive=1h use_temp_path=off;

        {{- if eq .Values.backend.type "java" }}
        # Java API Upstreams
        upstream java {
            server {{ include "npdb.fullname" . }}-java:8080 max_conns=150;
        }

        upstream java-replica {
            server {{ include "npdb.fullname" . }}-java:8080 weight=80 max_conns=120;
            server {{ include "npdb.fullname" . }}-java-replica:8080 weight=20 max_conns=100;
        }
        {{- else }}
        # Django API Upstream
        upstream django {
            server {{ include "npdb.fullname" . }}-django:8000 max_conns=2000;
        }
        {{- end }}

        client_max_body_size 100M;

        # --- Metadata API Proxy ---
        server {
            listen 8080;
            server_name {{ .Values.hosts.api }};

            proxy_hide_header Cache-Control;
            add_header Cache-Control {{ .Values.nginx.cacheControl | quote }};
            add_header X-Cache-Status $upstream_cache_status;
            proxy_cache my_cache;
            proxy_ignore_headers "Cache-Control" "Expires";

            proxy_read_timeout 1800;
            proxy_connect_timeout 1800;
            proxy_send_timeout 1800;

            {{ include "npdb.dbstoreLocations" . | nindent 12 }}

            {{- if eq .Values.backend.type "java" }}
            location /b2s/rest/v2/globalTagStatus {
                proxy_pass http://java;
                proxy_cache_valid 200 302 10h;
                proxy_redirect off;
            }

            location /b2s/rest/v2/globalTags {
                proxy_pass http://java;
                proxy_cache_valid 200 302 600s;
                proxy_redirect off;
            }

            location /b2s/rest/v2/iovPayloads {
                proxy_pass http://java-replica;
                proxy_cache_valid 200 302 300s;
                proxy_redirect off;
            }

            location / {
                proxy_pass http://java;
                proxy_cache_valid 200 302 60s;
                proxy_redirect off;
            }
            {{- else }}
            location /api/cdb_rest/gtstatus {
                proxy_pass http://django;
                proxy_redirect off;
                proxy_cache_valid 200 302 1h;
                proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            }

            location /api/cdb_rest/globalTags {
                proxy_pass http://django;
                proxy_redirect off;
                proxy_cache_valid 200 302 1s;
                proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            }

            location / {
                proxy_pass http://django;
                proxy_redirect off;
            }
            {{- end }}
        }

        # --- Payload Server ---
        server {
            listen 8080;
            server_name {{ .Values.hosts.files }};

            {{ include "npdb.dbstoreLocations" . | nindent 12 }}
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "npdb.fullname" . }}-nginx
  labels:
    {{- include "npdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  replicas: {{ .Values.nginx.replicas }}
  selector:
    matchLabels:
      {{- include "npdb.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nginx
  template:
    metadata:
      labels:
        {{- include "npdb.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nginx
    spec:
      {{- with .Values.nginx.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      #securityContext:
      #  runAsUser: 101
      #  fsGroup: 1000860000
      volumes:
        - name: files-volume
          {{- if or .Values.storage.payload.existingClaim .Values.storage.payload.create }}
          persistentVolumeClaim:
            claimName: {{ include "npdb.payloadClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: nginx-conf-volume
          configMap:
            name: {{ include "npdb.fullname" . }}-nginx-conf
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-pid
          emptyDir: {}
      containers:
        - name: nginx
          image: {{ include "npdb.workloadImage" (dict "root" . "component" "nginx" "image" .Values.images.nginx) | quote }}
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: files-volume
              mountPath: /usr/share/nginx/html
              {{- with .Values.storage.payload.subPath }}
              subPath: {{ . }}
              {{- end }}
            - name: nginx-conf-volume
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-pid
              mountPath: /var/run
          imagePullPolicy: {{ .Values.images.nginx.pullPolicy }}
---
kind: Service
apiVersion: v1
metadata:
  name: {{ include "npdb.fullname" . }}-nginx
  labels:
    {{- include "npdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  selector:
    {{- include "npdb.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
