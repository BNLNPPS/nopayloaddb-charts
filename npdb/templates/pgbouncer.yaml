{{- if .Values.pgbouncer.enabled }}
{{- if and .Values.postgresql.enabled .Values.postgresql.auth.existingSecret }}
{{- fail "pgbouncer.enabled cannot be used with postgresql.auth.existingSecret because PgBouncer currently requires a literal password" }}
{{- end }}
{{- $writerHost := include "npdb.databaseValue" (dict "root" . "connection" "writer" "field" "host") }}
{{- $writerPort := include "npdb.databaseValue" (dict "root" . "connection" "writer" "field" "port") }}
{{- $writerName := include "npdb.databaseValue" (dict "root" . "connection" "writer" "field" "name") }}
{{- $writerUser := include "npdb.databaseValue" (dict "root" . "connection" "writer" "field" "user") }}
{{- $writerPassword := include "npdb.databaseValue" (dict "root" . "connection" "writer" "field" "password") }}
{{- $reader1Host := include "npdb.databaseValue" (dict "root" . "connection" "reader1" "field" "host") }}
{{- $reader1Port := include "npdb.databaseValue" (dict "root" . "connection" "reader1" "field" "port") }}
{{- $reader1Name := include "npdb.databaseValue" (dict "root" . "connection" "reader1" "field" "name") }}
{{- $reader1User := include "npdb.databaseValue" (dict "root" . "connection" "reader1" "field" "user") }}
{{- $reader1Password := include "npdb.databaseValue" (dict "root" . "connection" "reader1" "field" "password") }}
{{- $reader2Host := include "npdb.databaseValue" (dict "root" . "connection" "reader2" "field" "host") }}
{{- $reader2Port := include "npdb.databaseValue" (dict "root" . "connection" "reader2" "field" "port") }}
{{- $reader2Name := include "npdb.databaseValue" (dict "root" . "connection" "reader2" "field" "name") }}
{{- $reader2User := include "npdb.databaseValue" (dict "root" . "connection" "reader2" "field" "user") }}
{{- $reader2Password := include "npdb.databaseValue" (dict "root" . "connection" "reader2" "field" "password") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "npdb.fullname" . }}-pgbouncer-conf
  labels:
    {{- include "npdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
data:
  pgbouncer.ini: |
    [databases]
    pgbouncer =
    {{ $writerName }} = host={{ $writerHost }} port={{ $writerPort }} dbname={{ $writerName }}
    {{- if not .Values.postgresql.enabled }}
    {{ $reader1Name }} = host={{ $reader1Host }} port={{ $reader1Port }} dbname={{ $reader1Name }}
    {{ $reader2Name }} = host={{ $reader2Host }} port={{ $reader2Port }} dbname={{ $reader2Name }}
    {{- end }}
    [pgbouncer]
    admin_users = {{ $writerUser }}
    ignore_startup_parameters = extra_float_digits
    listen_addr = *
    listen_port = 6432
    logfile = /var/log/pgbouncer/pgbouncer.log
    pidfile = /var/run/pgbouncer/pgbouncer.pid
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt
    unix_socket_dir = /var/run/pgbouncer
    pool_mode = transaction
    max_client_conn = 10000
    default_pool_size = 1100
    reserve_pool_size = 400
    reserve_pool_timeout = 5
  userlist.txt: |
    {{ $writerUser | quote }} {{ $writerPassword | quote }}
    {{- if ne $reader1User $writerUser }}
    {{ $reader1User | quote }} {{ $reader1Password | quote }}
    {{- end }}
    {{- if and (ne $reader2User $writerUser) (ne $reader2User $reader1User) }}
    {{ $reader2User | quote }} {{ $reader2Password | quote }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "npdb.fullname" . }}-pgbouncer
  labels:
    {{- include "npdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
spec:
  replicas: {{ .Values.pgbouncer.replicas }}
  selector:
    matchLabels:
      {{- include "npdb.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pgbouncer
  template:
    metadata:
      labels:
        {{- include "npdb.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pgbouncer
    spec:
      {{- if .Values.pgbouncer.node }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - {{ .Values.pgbouncer.node }}
      {{- end }}
      containers:
      - name: pgbouncer
        image: {{ include "npdb.workloadImage" (dict "root" . "component" "pgbouncer" "image" .Values.images.pgbouncer) | quote }}
        imagePullPolicy: {{ .Values.images.pgbouncer.pullPolicy }}
        ports:
        - containerPort: 6432
        volumeMounts:
        - name: pgbouncer-conf
          mountPath: /etc/pgbouncer
          readOnly: true
      volumes:
      - name: pgbouncer-conf
        configMap:
          name: {{ include "npdb.fullname" . }}-pgbouncer-conf
          items:
           - key: pgbouncer.ini
             path: pgbouncer.ini
           - key: userlist.txt
             path: userlist.txt
---
kind: Service
apiVersion: v1
metadata:
  name: {{ include "npdb.fullname" . }}-pgbouncer
  labels:
    {{- include "npdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
spec:
  selector:
    {{- include "npdb.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: pgbouncer
  ports:
    - name: "6432-tcp"
      protocol: TCP
      port: 6432
      targetPort: 6432
  type: ClusterIP
  sessionAffinity: None
{{- end }}
