apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: b2testpsql-postgres
  namespace: ${NAMESPACE}
  labels:
    app: postgres-monitoring
spec:
  selector:
    matchLabels:
      metrics-target: postgres
  namespaceSelector:
    matchNames:
      - ${NAMESPACE}
  # Promote the service's postgres-role label onto every scraped series (as
  # postgres_role) so dashboards can separate primary from replica -- the
  # Cluster Health replication-lag panel is meaningless without it.
  targetLabels:
    - postgres-role
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s